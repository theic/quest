<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quest visual workspace test</title>
<style>body{margin:0;background:#eef2f7;color:#17253a;font:20px system-ui}h1{margin:30px 70px;font-size:26px}canvas{display:block;margin:30px 70px;outline:none}</style></head>
<body><h1>Local workspace fixture</h1><canvas width="740" height="490" tabindex="0" contenteditable="true" aria-label="Canvas workspace"></canvas>
<script>
// Only pixels carry the recipient, composer content, button and receipt.
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
let body='',focused=false,selected=false,sent=[];
function box(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);}}
function text(value,x,y,size=20,color='#17253a'){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.fillText(value,x,y);}
function lines(value,x,y,maxWidth){let row='';for(const word of value.split(' ')){const next=row?row+' '+word:word;if(ctx.measureText(next).width>maxWidth){ctx.fillText(row,x,y);y+=26;row=word;}else row=next;}ctx.fillText(row,x,y);}
function draw(){
  ctx.clearRect(0,0,740,490);box(0,0,738,488,'white','#b7c6d8');text('To: Alex (demo contact)',24,48,22);
  box(24,75,690,140,'#f6f8fc');if(!sent.length)text('No sent messages yet.',40,110);
  else {box(36,86,666,114,'#ddf5e3','#72bd8a');ctx.fillStyle='#17253a';ctx.font='20px system-ui';lines(sent.at(-1),50,118,630);text('Delivered ✓✓',50,176,16,'#166330');}
  text('Message',24,258,18);box(24,275,690,110,'white',focused?'#245fc7':'#7c94b0');ctx.fillStyle=body?'#17253a':'#6d7b8b';ctx.font='20px system-ui';lines(body||'Write a message',40,307,656);
  box(24,403,128,50,'#245fc7');text('Send',66,435,20,'white');
}
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(x>=24&&x<=714&&y>=275&&y<=385){focused=true;canvas.focus();}else if(x>=24&&x<=152&&y>=403&&y<=453&&body.trim()){sent.push(body);body='';focused=false;location.hash='sent';}draw();});
canvas.addEventListener('keydown',e=>{if(!focused)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();selected=true;}else if(e.key==='Backspace'){e.preventDefault();body=selected?'':body.slice(0,-1);selected=false;draw();}else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){e.preventDefault();body=selected?e.key:body+e.key;selected=false;draw();}});
canvas.addEventListener('beforeinput',e=>{e.preventDefault();if(focused&&e.data){body=selected?e.data:body+e.data;selected=false;draw();}});
draw();
</script></body></html>
