<!doctype html>
<!--
  The link preview (og.png, 1200 x 630): what a chat, a search result or a post shows for messaging.quest.
  It is the title screen in one picture: the Visor, the name, the line and the networks.
  scripts/render-share-images.cjs fills in {{public}}, {{fonts}} and the sprite, then takes the picture.
-->
<html lang="en"><head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "DM Sans"; src: url("{{fonts}}/dm-sans-latin.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "JetBrains Mono"; src: url("{{fonts}}/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 500 600; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #0b0c0b; color: #e8e8dc; font-family: "DM Sans", Arial, sans-serif;
  }
  .sprite { position: absolute; width: 0; height: 0; }
  .card { position: absolute; inset: 0; display: grid; grid-template-columns: 340px 1fr; align-items: center; gap: 60px; padding: 0 84px 0 92px; }
  .mark { position: relative; }
  .mark::before {
    content: ""; position: absolute; inset: -62%; border-radius: 50%;
    background: radial-gradient(closest-side, #ceff322e, #ceff320c 55%, transparent);
  }
  .mark img { position: relative; display: block; width: 100%; filter: drop-shadow(0 26px 40px #000c); }
  .words { display: grid; gap: 0; }
  .kicker { margin: 0 0 22px; font: 600 19px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #ceff32; }
  h1 { margin: 0; font-size: 88px; line-height: 1; font-weight: 700; letter-spacing: -.05em; white-space: nowrap; }
  h1 span { color: #ceff32; }
  p { margin: 24px 0 34px; font-size: 38px; line-height: 1.2; font-weight: 500; letter-spacing: -.02em; color: #a4a59b; }
  p em { font-style: normal; color: #e8e8dc; }
  ul { display: flex; gap: 12px; margin: 0; padding: 0; list-style: none; }
  li { display: grid; place-items: center; width: 54px; height: 54px; border: 1.5px solid #ffffff33; border-radius: 50%; background: #121311; color: #e8e8dc; }
  li svg { width: 26px; height: 26px; }
  .foot { position: absolute; left: 92px; right: 84px; bottom: 0; height: 6px; background: linear-gradient(90deg, #ceff32, #ceff3200); border-radius: 6px 6px 0 0; }
</style>
</head>
<body>
<!-- sprite -->
<div class="card">
  <div class="mark"><img src="{{public}}/quest.svg" alt=""></div>
  <div class="words">
    <div class="kicker">Your brand on autopilot</div>
    <h1>messaging<span>.quest</span></h1>
    <p>Builds your brand<br> <em>while you build the product.</em></p>
    <ul>
      <li><svg><use href="#logo-x"></use></svg></li>
      <li><svg><use href="#logo-linkedin"></use></svg></li>
      <li><svg><use href="#logo-reddit"></use></svg></li>
      <li><svg><use href="#logo-instagram"></use></svg></li>
      <li><svg><use href="#logo-youtube"></use></svg></li>
      <li><svg><use href="#logo-tiktok"></use></svg></li>
      <li><svg><use href="#logo-threads"></use></svg></li>
      <li><svg><use href="#logo-facebook"></use></svg></li>
    </ul>
  </div>
</div>
<div class="foot"></div>
</body></html>
