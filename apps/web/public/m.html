<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>People for what you made</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      @font-face { font-family: "DM Sans"; src: url("/fonts/dm-sans-latin.woff2") format("woff2"); font-weight: 100 1000; font-display: swap; }
      :root { --bg: #0b0c0b; --card: #161715; --line: #ffffff1f; --ink: #e8e8dc; --muted: #a4a59b; --accent: #ceff32; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "DM Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      main { max-width: 620px; margin: 0 auto; padding: 48px 16px 32px; }
      h2 { font-size: 18px; margin: 28px 0 4px; font-weight: 600; }
      h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
      .sub { color: var(--muted); margin: 0 0 28px; overflow-wrap: anywhere; }
      .sub a { color: inherit; }
      ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      li a { display: block; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; }
      li a:hover, li a:focus-visible { border-color: var(--accent); outline: none; }
      .who { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
      .who span:last-child { color: var(--muted); font-weight: 400; font-size: 13px; white-space: nowrap; }
      .said { margin: 4px 0 0; color: var(--muted); overflow-wrap: anywhere; }
      .none { color: var(--muted); }
      .more { margin-top: 28px; }
      .more a { display: block; text-align: center; padding: 14px 16px; border-radius: 14px; background: var(--accent); color: #0b0c0b; font-weight: 600; text-decoration: none; }
      .more a:hover, .more a:focus-visible { filter: brightness(1.08); outline: 2px solid var(--ink); outline-offset: 2px; }
      .more p { margin: 10px 0 0; color: var(--muted); font-size: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="head">One moment</h1>
      <p class="sub" id="sub"></p>
      <ol id="people"></ol>
      <h2 id="fithead" hidden>Might fit too</h2>
      <p class="sub" id="fitsub" hidden>They didn't ask for it, so nobody wrote to them. Their posts are here if you want to say hi.</p>
      <ol id="fits"></ol>
      <div class="more" id="more" hidden><a id="morelink" href="https://www.messaging.quest/?utm_source=match">Find more people like these</a><p>New ones every day, and the first run is free.</p></div>
    </main>
    <script>
      // A maker's page: everyone their link went to, read by its code from the database that keeps it ("t" first: dev's).
      (async () => {
        const DB = {
          live: ["https://atjukklkmfwhmbbzxaod.supabase.co", "sb_publishable_hG7fm_52dqZDw7haT-NhGQ_f0jpYrsN"],
          dev: ["https://bglbnziyilxkxgzortuf.supabase.co", "sb_publishable_59ruBk4aIqdQgWEC9do_6Q_S-s1J4LQ"],
        };
        const $ = (id) => document.getElementById(id);
        const el = (tag, text, cls) => { const e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; };
        const web = (u) => (/^https?:\/\//i.test(String(u ?? "")) ? String(u) : null);
        const site = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
        const raw = (location.pathname.split("/").filter(Boolean)[1] ?? "").trim();
        const [url, key] = raw.startsWith("t") ? DB.dev : DB.live;
        const code = raw.replace(/^t/, "");
        const gone = () => { $("head").textContent = "Nothing here"; $("sub").textContent = "This page was not found. Check the link you were sent."; };
        if (!/^[A-Fa-f0-9]{10}$/.test(code)) return gone();
        const page = await fetch(`${url}/rest/v1/rpc/match_page`, { method: "POST", headers: { apikey: key, "content-type": "application/json" }, body: JSON.stringify({ code }) }).then((r) => (r.ok ? r.json() : null), () => null);
        if (!page) return gone();
        // Counted, so the page can be judged: who opened it, and who went on from it.
        const seen = (what) => fetch(`${url}/rest/v1/rpc/match_page_seen`, { method: "POST", keepalive: true, headers: { apikey: key, "content-type": "application/json" }, body: JSON.stringify({ code, what }) }).catch(() => undefined);
        void seen("view");
        // The way on carries this page, so Quest starts from what they made and who was found, not from a blank page.
        const more = $("morelink");
        more.href = `https://www.messaging.quest/?m=${encodeURIComponent(raw)}&utm_source=match`;
        more.addEventListener("click", () => void seen("click"));
        $("more").hidden = false;
        const all = Array.isArray(page.people) ? page.people.filter((p) => web(p?.url)) : [];
        // Whoever asked got the link; the rest only showed the need, and nobody wrote to them.
        const people = all.filter((p) => !p.fit);
        const fits = all.filter((p) => p.fit);
        // A page of people found for them with nobody written to (they left a link, or asked for a page).
        const found = page.sent === false;
        const only = !found && !people.length && fits.length > 0;
        $("head").textContent = found ? (all.length === 1 ? "1 person who could use what you made" : `${all.length} people who could use what you made`) : only ? (fits.length === 1 ? "1 person who might fit" : `${fits.length} people who might fit`) : people.length === 1 ? "1 person got your link" : `${people.length} people got your link`;
        const sub = $("sub");
        sub.textContent = `For ${page.maker ?? "you"}. ${found ? "Found this week, each by what they posted. Nobody wrote to them: their posts are here if you want to say hi." : only ? "None of them asked for it, so nobody wrote to them. Their posts are here if you want to say hi." : "Each of them asked for something like what you made."} `;
        if (web(page.launch)) { const a = el("a", "Your post"); a.href = web(page.launch); a.rel = "noopener"; sub.append(a); }
        const list = (p, into) => {
          const a = el("a");
          a.href = web(p.url);
          a.target = "_blank";
          a.rel = "noopener";
          const who = el("div", null, "who");
          who.append(el("span", String(p.author ?? "Someone")), el("span", site(p.url)));
          a.append(who, el("p", `"${String(p.quote ?? "").trim()}"`, "said"));
          const li = el("li");
          li.append(a);
          $(into).append(li);
        };
        for (const p of people) list(p, "people");
        for (const p of fits) list(p, only || found ? "people" : "fits");
        if (fits.length && !only && !found) { $("fithead").hidden = false; $("fitsub").hidden = false; }
        if (!all.length) $("people").append(el("li", "Nobody yet.", "none"));
      })();
    </script>
  </body>
</html>
